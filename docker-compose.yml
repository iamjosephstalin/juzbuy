version: '3.8'

services:
  juzbuy-app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    volumes:
      - ./public:/app/public:ro
    networks:
      - juzbuy-network

  # Nginx reverse proxy (optional)
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/ssl:ro  # SSL certificates directory
    depends_on:
      - juzbuy-app
    networks:
      - juzbuy-network
    restart: unless-stopped

networks:
  juzbuy-network:
    driver: bridge

volumes:
  ssl_certs: